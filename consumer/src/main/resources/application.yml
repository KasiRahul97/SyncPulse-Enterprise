server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: syncpulse-consumer
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:syncpulse-companion}
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.use.type.headers: false

syncpulse:
  kafka:
    topic: ${KAFKA_TOPIC:syncpulse.playhead.changes}
  cors:
    allowed-origins: ${SYNCPULSE_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.syncpulse: INFO
    org.apache.kafka: WARN
