# ============================================================================
# SyncPulse Enterprise — full local stack
#
#   docker compose up --build
#
# Dashboard : http://localhost:3000
# Backend   : http://localhost:8080  (Swagger UI: /swagger-ui.html)
# Consumer  : http://localhost:8081  (Companion Service)
# ============================================================================

name: syncpulse

services:
  # ---------------------------------------------------------------- Redis ----
  redis:
    image: redis:7.4-alpine
    container_name: syncpulse-redis
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [syncpulse]

  # ------------------------------------------------------------ Cassandra ----
  cassandra:
    image: cassandra:4.1
    container_name: syncpulse-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: SyncPulseCluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      # Keep a demo-friendly memory footprint.
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
      CASSANDRA_NUM_TOKENS: 1
    healthcheck:
      # "container started" != "database ready" — probe with a real CQL query.
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    volumes:
      - cassandra-data:/var/lib/cassandra
    networks: [syncpulse]

  # Idempotent schema bootstrap (runs once, after Cassandra is healthy).
  cassandra-init:
    image: cassandra:4.1
    container_name: syncpulse-cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./infrastructure/cassandra/schema.cql:/schema.cql:ro
    environment:
      CASSANDRA_REPLICATION_FACTOR: "${CASSANDRA_REPLICATION_FACTOR:-1}"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Applying SyncPulse schema to Cassandra...";
        cqlsh cassandra 9042 -f /schema.cql &&
        echo "Schema applied successfully.";
    networks: [syncpulse]

  # ---------------------------------------------------------------- Kafka ----
  # Single-node KRaft (no ZooKeeper).
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: syncpulse-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "SyncPulseKRaftCluster1"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks: [syncpulse]

  # Create the topic explicitly so partitioning is deterministic.
  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    container_name: syncpulse-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic ${KAFKA_TOPIC:-syncpulse.playhead.changes} --partitions 3 --replication-factor 1 &&
        echo "Kafka topic ready.";
    networks: [syncpulse]

  # -------------------------------------------------------------- Backend ----
  backend:
    # Default backend is the Python (FastAPI) implementation.
    # To run the Java (Spring Boot) backend instead, add: -f docker-compose.java.yml
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    container_name: syncpulse-backend
    depends_on:
      redis:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: 8080
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: 9042
      CASSANDRA_KEYSPACE: "${CASSANDRA_KEYSPACE:-syncpulse}"
      CASSANDRA_DATACENTER: "${CASSANDRA_DATACENTER:-datacenter1}"
      CASSANDRA_REPLICATION_FACTOR: "${CASSANDRA_REPLICATION_FACTOR:-1}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: "${KAFKA_TOPIC:-syncpulse.playhead.changes}"
      DEBOUNCE_POSITION_THRESHOLD: "${DEBOUNCE_POSITION_THRESHOLD:-5}"
      DEBOUNCE_TIME_THRESHOLD: "${DEBOUNCE_TIME_THRESHOLD:-10}"
      SYNCPULSE_CDC_MODE: "${SYNCPULSE_CDC_MODE:-local}"
      SYNCPULSE_SEED_ENABLED: "${SYNCPULSE_SEED_ENABLED:-true}"
      SYNCPULSE_CORS_ORIGINS: "${SYNCPULSE_CORS_ORIGINS:-http://localhost:3000}"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks: [syncpulse]

  # -------------------------------------------- Downstream Consumer (Kafka) ---
  consumer:
    # Default consumer is the Python (FastAPI) implementation.
    build:
      context: ./consumer-python
      dockerfile: Dockerfile
    container_name: syncpulse-consumer
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: 8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: "${KAFKA_TOPIC:-syncpulse.playhead.changes}"
      KAFKA_CONSUMER_GROUP: "${KAFKA_CONSUMER_GROUP:-syncpulse-companion}"
      SYNCPULSE_CORS_ORIGINS: "${SYNCPULSE_CORS_ORIGINS:-http://localhost:3000}"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/consumer/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [syncpulse]

  # ------------------------------------------------------------- Frontend ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: syncpulse-frontend
    depends_on:
      backend:
        condition: service_healthy
      consumer:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [syncpulse]

volumes:
  cassandra-data:

networks:
  syncpulse:
    driver: bridge
