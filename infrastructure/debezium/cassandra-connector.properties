# ===========================================================================
# Representative Debezium Cassandra connector configuration.
#
# NOTE: The Debezium Cassandra connector runs as an AGENT co-located with the
# Cassandra node (it reads local commit-log CDC segments), not inside Kafka
# Connect. Property names vary by Debezium/Cassandra version — treat this as a
# documented starting point, and consult the Debezium Cassandra docs for the
# exact version matrix. See ./README.md.
# ===========================================================================

connector.name=syncpulse-cassandra

# Cassandra CDC commit-log locations (must match cassandra.yaml).
cassandra.config=/etc/cassandra/cassandra.yaml
cassandra.hosts=cassandra
cassandra.port=9042
commit.log.relocation.dir=/var/lib/cassandra/cdc_relocation
commit.log.real.time.processing.enabled=true

# Kafka sink.
kafka.producer.bootstrap.servers=kafka:29092
topic.prefix=syncpulse

# Only capture the authoritative state table.
# (playhead_state must be created/altered WITH cdc = true)
snapshot.consistency=ALL

# Map the Debezium change envelope to the SyncPulse event schema downstream
# using a Single Message Transform / stream processor so that consumers see:
#   { eventType: PLAYHEAD_UPDATED, cdcSource: DEBEZIUM, ... }
